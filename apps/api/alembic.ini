# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS:
# alembic.ini is the top-level configuration for the Alembic migration tool.
# It tells Alembic WHERE migration scripts live, WHICH template to use for
# new migrations, and provides a FALLBACK database URL (overridden at runtime
# by env.py so we read from our existing app.config.Settings instead).
#
# CONCEPT: Alembic uses a .ini file (Python's ConfigParser format) as its
# entry point. When you run `alembic upgrade head`, it reads THIS file first,
# then delegates to env.py for actual execution.
#
# WHY alembic over raw SQL scripts:
#   - Tracks migration history in an `alembic_version` table
#   - Supports up/down (upgrade/downgrade) for safe rollbacks
#   - Autogenerate can diff your ORM models vs DB state
#   - Industry standard for SQLAlchemy projects
# ─────────────────────────────────────────────────────────────────────────────

[alembic]

# Path to the migration scripts directory (relative to this .ini file)
script_location = migrations

# Template used when generating new migration files via `alembic revision`
# file_template controls the filename pattern for generated migrations
# %%(rev)s = revision hash, %%(slug)s = slugified message
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps (UTC keeps things consistent across devs)
timezone = UTC

# This URL is a FALLBACK — env.py overrides it with settings.DATABASE_URL
# so we never hardcode credentials here. The placeholder below is intentional.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
